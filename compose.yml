services:
  vllm:
    image: vllm/vllm-openai:nightly-x86_64
    ipc: host
    ports:
      - "8000:8000"
    gpus: all
    environment:
      - HF_HOME=/root/.cache/huggingface
    command:
      - ${MODEL_NAME:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - MODEL_NAME=${MODEL_NAME:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT:-You are a helpful AI assistant.}
    depends_on:
      - vllm
    restart: unless-stopped

volumes:
  hf-cache: