services:
  vllm:
    image: vllm/vllm-openai:nightly-x86_64
    ipc: host
    gpus: all
    environment:
      - HF_HOME=/root/.cache/huggingface
    command:
      - TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - vllm
    restart: unless-stopped

volumes:
  hf-cache: