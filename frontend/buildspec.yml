# CodeBuild build spec - builds React frontend and deploys to S3
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - cd frontend
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - echo Deploying to S3...
      - aws s3 sync dist/ s3://$S3_BUCKET --delete
      - echo Invalidating CloudFront cache...
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"
